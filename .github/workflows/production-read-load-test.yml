name: Production Read Load Test

on:
  push:
    branches:
      - codex/production-read-load-test-20260729
    paths:
      - .github/workflows/production-read-load-test.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: production-read-load-test
  cancel-in-progress: true

jobs:
  load-test:
    if: github.ref == 'refs/heads/codex/production-read-load-test-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://bookflow-green.vercel.app/
      SUPABASE_URL: https://rgkpmxbpejfwcuxncadh.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJna3BteGJwZWpmd2N1eG5jYWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDQ3MzcsImV4cCI6MjA5NjU4MDczN30.KkMAVHa-PG9hHjEQvj8yPhjJKKvTpElYendcI5aIlnU
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded 200-concurrency verification
        id: load
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -f PRODUCTION_LOAD_TEST_RESULT.json
          node <<'NODE' | tee load-test.log
          const fs = require('fs');

          (async () => {
            const siteUrl = process.env.SITE_URL;
            const supabaseUrl = process.env.SUPABASE_URL;
            const anonKey = process.env.SUPABASE_ANON_KEY;
            const percentile = (values, ratio) => {
              if (!values.length) return 0;
              const sorted = [...values].sort((a, b) => a - b);
              return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * ratio) - 1)];
            };
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function request(url, options = {}) {
              const started = performance.now();
              try {
                const response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(5000),
                  headers: {
                    'User-Agent': 'BookFlow-authorized-read-load-test/2026-07-29',
                    ...(options.headers || {}),
                  },
                });
                const elapsed = performance.now() - started;
                await response.arrayBuffer();
                return { ok: response.ok, status: response.status, elapsed };
              } catch (error) {
                return {
                  ok: false,
                  status: error instanceof Error ? error.name : 'NetworkError',
                  elapsed: performance.now() - started,
                };
              }
            }

            async function runStage({ name, concurrency, seconds, makeRequest }) {
              const stopAt = Date.now() + seconds * 1000;
              const results = [];
              async function worker() {
                while (Date.now() < stopAt) {
                  results.push(await makeRequest());
                  await sleep(1000);
                }
              }
              const started = performance.now();
              await Promise.all(Array.from({ length: concurrency }, () => worker()));
              const duration = (performance.now() - started) / 1000;
              const success = results.filter((result) => result.ok);
              const failed = results.length - success.length;
              const errorRate = results.length ? failed / results.length * 100 : 100;
              const latencies = success.map((result) => result.elapsed);
              const statuses = {};
              for (const result of results) statuses[result.status] = (statuses[result.status] || 0) + 1;
              return {
                name,
                concurrency,
                seconds,
                requests: results.length,
                successful: success.length,
                failed,
                reqPerSecond: Number((success.length / duration).toFixed(2)),
                p50Ms: Math.round(percentile(latencies, 0.5)),
                p95Ms: Math.round(percentile(latencies, 0.95)),
                p99Ms: Math.round(percentile(latencies, 0.99)),
                errorRatePercent: Number(errorRate.toFixed(2)),
                statuses,
              };
            }

            const homepage = await runStage({
              name: 'homepage_get',
              concurrency: 200,
              seconds: 10,
              makeRequest: () => request(siteUrl, { method: 'GET', redirect: 'follow' }),
            });

            const rpcBody = JSON.stringify({
              p_limit: 25,
              p_cursor_created: null,
              p_cursor_id: null,
              p_department: null,
              p_max_price: null,
              p_query: null,
            });
            const rpc = await runStage({
              name: 'list_books_page_rpc',
              concurrency: 200,
              seconds: 15,
              makeRequest: () => request(`${supabaseUrl}/rest/v1/rpc/list_books_page`, {
                method: 'POST',
                headers: {
                  apikey: anonKey,
                  Authorization: `Bearer ${anonKey}`,
                  'Content-Type': 'application/json',
                },
                body: rpcBody,
              }),
            });

            const report = {
              generatedAt: new Date().toISOString(),
              productionCommit: 'e711182cd68d9d5f1a01147de7a3c2767d16da30',
              scope: 'read-only homepage GET and list_books_page RPC',
              stopThreshold: { errorRatePercent: 1, p95Ms: 1500 },
              results: [homepage, rpc],
            };
            fs.writeFileSync('PRODUCTION_LOAD_TEST_RESULT.json', `${JSON.stringify(report, null, 2)}\n`);
            console.log(`FINAL_REPORT ${JSON.stringify(report)}`);
            const failedThreshold = report.results.some((result) => result.errorRatePercent >= 1 || result.p95Ms > 1500);
            if (failedThreshold) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit result evidence
        if: always()
        shell: bash
        run: |
          if [ ! -f PRODUCTION_LOAD_TEST_RESULT.json ]; then
            echo '{"status":"NOT VERIFIED","reason":"runner produced no result file"}' > PRODUCTION_LOAD_TEST_RESULT.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION_LOAD_TEST_RESULT.json
          git commit -m "test: record production read load result" || true
          git push

      - name: Mark threshold failure
        if: steps.load.outcome == 'failure'
        run: exit 1
