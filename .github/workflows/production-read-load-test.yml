name: Production Read Load Test

on:
  push:
    branches:
      - codex/production-read-load-test-20260729
    paths:
      - .github/workflows/production-read-load-test.yml
      - app/api/internal/production-read-load-test/route.ts

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-read-load-test
  cancel-in-progress: true

jobs:
  load-test:
    if: github.ref == 'refs/heads/codex/production-read-load-test-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://bookflow-green.vercel.app/
      SUPABASE_URL: https://rgkpmxbpejfwcuxncadh.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJna3BteGJwZWpmd2N1eG5jYWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDQ3MzcsImV4cCI6MjA5NjU4MDczN30.KkMAVHa-PG9hHjEQvj8yPhjJKKvTpElYendcI5aIlnU
    steps:
      - name: Run bounded read-only load test
        id: load
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' | tee load-test.log
          const siteUrl = process.env.SITE_URL;
          const supabaseUrl = process.env.SUPABASE_URL;
          const anonKey = process.env.SUPABASE_ANON_KEY;
          const stages = [5, 10, 25, 50, 100, 200];
          const percentile = (values, ratio) => {
            if (!values.length) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * ratio) - 1)];
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(url, options = {}) {
            const started = performance.now();
            try {
              const response = await fetch(url, {
                ...options,
                signal: AbortSignal.timeout(5000),
                headers: {
                  'User-Agent': 'BookFlow-authorized-read-load-test/2026-07-29',
                  ...(options.headers || {}),
                },
              });
              const elapsed = performance.now() - started;
              await response.arrayBuffer();
              return { ok: response.ok, status: response.status, elapsed };
            } catch (error) {
              return {
                ok: false,
                status: error instanceof Error ? error.name : 'NetworkError',
                elapsed: performance.now() - started,
              };
            }
          }

          async function runStage({ name, concurrency, seconds, intervalMs, makeRequest }) {
            const stopAt = Date.now() + seconds * 1000;
            const results = [];
            async function worker() {
              while (Date.now() < stopAt) {
                results.push(await makeRequest());
                if (intervalMs > 0) await sleep(intervalMs);
              }
            }
            const started = performance.now();
            await Promise.all(Array.from({ length: concurrency }, () => worker()));
            const duration = (performance.now() - started) / 1000;
            const success = results.filter((result) => result.ok);
            const failed = results.length - success.length;
            const errorRate = results.length ? failed / results.length * 100 : 100;
            const latencies = success.map((result) => result.elapsed);
            const statuses = {};
            for (const result of results) statuses[result.status] = (statuses[result.status] || 0) + 1;
            const summary = {
              name,
              concurrency,
              requests: results.length,
              successful: success.length,
              failed,
              reqPerSecond: Number((success.length / duration).toFixed(2)),
              p50Ms: Math.round(percentile(latencies, 0.5)),
              p95Ms: Math.round(percentile(latencies, 0.95)),
              p99Ms: Math.round(percentile(latencies, 0.99)),
              errorRatePercent: Number(errorRate.toFixed(2)),
              statuses,
            };
            console.log(`LOAD_RESULT ${JSON.stringify(summary)}`);
            return summary;
          }

          async function runScenario(name, seconds, intervalMs, makeRequest) {
            console.log(`SCENARIO_START ${name}`);
            const summaries = [];
            for (const concurrency of stages) {
              const summary = await runStage({ name, concurrency, seconds, intervalMs, makeRequest });
              summaries.push(summary);
              if (summary.errorRatePercent >= 1 || summary.p95Ms > 1500) {
                console.log(`STOP_THRESHOLD ${JSON.stringify(summary)}`);
                break;
              }
              await sleep(2000);
            }
            return summaries;
          }

          const homepageResults = await runScenario(
            'homepage_get',
            10,
            1000,
            () => request(siteUrl, { method: 'GET', redirect: 'follow' }),
          );

          const rpcBody = JSON.stringify({
            p_limit: 25,
            p_cursor_created: null,
            p_cursor_id: null,
            p_department: null,
            p_max_price: null,
            p_query: null,
          });
          const rpcResults = await runScenario(
            'list_books_page_rpc',
            15,
            1000,
            () => request(`${supabaseUrl}/rest/v1/rpc/list_books_page`, {
              method: 'POST',
              headers: {
                apikey: anonKey,
                Authorization: `Bearer ${anonKey}`,
                'Content-Type': 'application/json',
              },
              body: rpcBody,
            }),
          );

          console.log(`FINAL_REPORT ${JSON.stringify({ homepageResults, rpcResults })}`);
          const all = [...homepageResults, ...rpcResults];
          const failedThreshold = all.some((result) => result.errorRatePercent >= 1 || result.p95Ms > 1500);
          if (failedThreshold) process.exitCode = 1;
          NODE

      - name: Publish results to PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOAD_OUTCOME: ${{ steps.load.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const log = fs.existsSync('load-test.log') ? fs.readFileSync('load-test.log', 'utf8') : '';
          const finalLine = log.split(/\r?\n/).find((line) => line.startsWith('FINAL_REPORT '));
          const lines = [
            '## Production read load test result',
            '',
            `Workflow load step outcome: **${process.env.LOAD_OUTCOME || 'unknown'}**`,
            '',
            'Scope: production homepage GET and read-only `list_books_page` RPC. No writes were performed.',
            '',
          ];
          if (!finalLine) {
            lines.push('No final report was produced. Test result: **NOT VERIFIED**.');
          } else {
            const report = JSON.parse(finalLine.slice('FINAL_REPORT '.length));
            lines.push('| Scenario | Concurrency | Requests | Req/s | p50 | p95 | p99 | Error rate | Statuses |');
            lines.push('|---|---:|---:|---:|---:|---:|---:|---:|---|');
            for (const result of [...report.homepageResults, ...report.rpcResults]) {
              lines.push(`| ${result.name} | ${result.concurrency} | ${result.requests} | ${result.reqPerSecond} | ${result.p50Ms} ms | ${result.p95Ms} ms | ${result.p99Ms} ms | ${result.errorRatePercent}% | \`${JSON.stringify(result.statuses)}\` |`);
            }
            lines.push('', 'Stop threshold: error rate >= 1% or p95 > 1500 ms.');
          }
          fs.writeFileSync('load-test-comment.md', `${lines.join('\n')}\n`);
          NODE
          gh pr comment 164 --repo "$GITHUB_REPOSITORY" --body-file load-test-comment.md

      - name: Mark workflow failed when threshold reached
        if: steps.load.outcome == 'failure'
        run: exit 1
