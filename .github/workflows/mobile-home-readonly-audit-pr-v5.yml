name: Mobile homepage readonly audit PR v5

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run compact diagnostics
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/mobile-audit && cd /tmp/mobile-audit
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const r={checks:[],visibleButtons:[],consoleErrors:[],pageErrors:[],failedRequests:[],badResponses:[],fatal:null};
          const short=e=>String(e?.message||e).replace(/\s+/g,' ').slice(0,180);
          const add=(name,status,detail='')=>r.checks.push({name,status,detail});
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            const c=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'});
            const p=await c.newPage();p.setDefaultTimeout(5000);
            p.on('console',m=>{if(m.type()==='error')r.consoleErrors.push(m.text().slice(0,240))});
            p.on('pageerror',e=>r.pageErrors.push(String(e).slice(0,240)));
            p.on('requestfailed',q=>r.failedRequests.push({url:q.url().slice(0,240),error:q.failure()?.errorText||''}));
            p.on('response',x=>{if(x.status()>=400)r.badResponses.push({url:x.url().slice(0,240),status:x.status()})});
            const reset=async()=>{await p.goto('https://bookflow-green.vercel.app/',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(800)};
            const check=async(name,fn)=>{try{await fn();add(name,'PASS')}catch(e){add(name,'FAIL',short(e))}};
            await reset();add('首頁載入','PASS',p.url());
            await check('無水平溢位',async()=>{const s=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth}));if(s.sw>s.iw+2)throw Error(JSON.stringify(s))});
            await check('手機選單開啟',async()=>{const b=p.getByRole('button',{name:/開啟選單|關閉選單/}).first();await b.click();await p.waitForTimeout(200);if((await b.getAttribute('aria-expanded'))!=='true')throw Error('aria-expanded!='+'true');r.visibleButtons=await p.locator('button:visible').allTextContents()});
            for(const label of ['二手書籍','二手物品','零元贈送'])await check('市場切換：'+label,async()=>{await reset();const m=p.getByRole('button',{name:/開啟選單/}).first();if(await m.count())await m.click();const b=p.getByRole('button',{name:label,exact:true}).filter({visible:true});if(!(await b.count()))throw Error('找不到可見按鈕');await b.first().click();await p.waitForTimeout(300);if(!(await p.locator('body').innerText()).includes(label))throw Error('切換後頁面未含標籤')});
            for(const label of ['我要刊登','我的交易','登入／註冊','訊息','購物車'])await check('未登入入口：'+label,async()=>{await reset();let b=p.getByRole('button',{name:new RegExp(label)}).filter({visible:true}).first();if(!(await b.count())){const m=p.getByRole('button',{name:/開啟選單/}).first();if(await m.count())await m.click();b=p.getByRole('button',{name:new RegExp(label)}).filter({visible:true}).first()}if(!(await b.count()))throw Error('找不到可見按鈕');await b.click();await p.waitForTimeout(300);if(!/登入|註冊|信箱|Google/.test(await p.locator('body').innerText()))throw Error('未出現登入介面')});
            await check('Hero 搜尋',async()=>{await reset();const i=p.getByPlaceholder(/搜尋二手書名、課程或老師/);await i.fill('微積分');await p.getByRole('button',{name:/依目前輸入開始找二手書籍|開始找二手書/}).first().click();await p.waitForTimeout(300);if(!(await p.locator('input').evaluateAll(xs=>xs.map(x=>x.value))).some(v=>v.includes('微積分')))throw Error('搜尋值未同步')});
            await check('列表搜尋',async()=>{await reset();const i=p.getByPlaceholder('搜尋課本...');await i.fill('英文');if((await i.inputValue())!=='英文')throw Error('輸入失敗')});
            await check('科系篩選',async()=>{await reset();const s=p.getByLabel('科系');await s.selectOption({label:'資訊工程系'});if((await s.inputValue())!=='資訊工程系')throw Error('選取失敗')});
            await check('價格篩選',async()=>{await reset();const s=p.getByLabel('最高價格');await s.selectOption('300');if((await s.inputValue())!=='300')throw Error('選取失敗')});
            await check('圖片搜尋檔案選擇器',async()=>{await reset();const chooser=p.waitForEvent('filechooser',{timeout:5000});await p.getByRole('button',{name:/用照片找二手書|照片搜二手書/}).first().click();await chooser});
            for(const [n,path] of [['隱私權','/privacy'],['使用條款','/terms'],['交易安全','/safety']])await check('Footer：'+n,async()=>{await reset();await p.getByRole('link',{name:n,exact:true}).click();await p.waitForLoadState('domcontentloaded');if(!new URL(p.url()).pathname.startsWith(path))throw Error(p.url())});
            await check('問題回報入口',async()=>{await reset();await p.getByRole('button',{name:'問題回報',exact:true}).click();await p.waitForTimeout(300);if(!/問題回報|回報|意見/.test(await p.locator('body').innerText()))throw Error('未開啟')});
          }catch(e){r.fatal=short(e)}finally{if(browser)await browser.close()}
          r.summary={pass:r.checks.filter(x=>x.status==='PASS').length,fail:r.checks.filter(x=>x.status==='FAIL').length,consoleErrors:r.consoleErrors.length,pageErrors:r.pageErrors.length,failedRequests:r.failedRequests.length,badResponses:r.badResponses.length};
          console.log('COMPACT_AUDIT='+JSON.stringify(r));
          EOF
          node audit.mjs
