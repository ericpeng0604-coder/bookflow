name: Check staging seller E2E secrets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-seller-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
      E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
    steps:
      - name: Confirm seller E2E secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_SELLER_EMAIL"
          echo "PRESENT: E2E_SELLER_EMAIL"
          test -n "$E2E_SELLER_PASSWORD"
          echo "PRESENT: E2E_SELLER_PASSWORD"
