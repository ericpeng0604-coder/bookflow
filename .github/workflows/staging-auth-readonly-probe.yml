name: Staging auth readonly probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging password authentication and basic role
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$E2E_TEST_EMAIL"
          echo "::add-mask::$E2E_TEST_PASSWORD"
          node scripts/staging-auth-readonly-probe.mjs
