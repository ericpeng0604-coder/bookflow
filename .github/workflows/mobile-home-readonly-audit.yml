name: Mobile homepage readonly audit

on:
  push:
    branches:
      - agent/mobile-home-readonly-audit-20260725
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://bookflow-green.vercel.app/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Run readonly mobile audit
        run: |
          mkdir -p audit-output
          cat > /tmp/mobile-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const target = process.env.TARGET_URL;
          const report = {
            target,
            viewport: { width: 390, height: 844 },
            startedAt: new Date().toISOString(),
            checks: [],
            console: [],
            pageErrors: [],
            failedRequests: [],
            badResponses: [],
          };

          const add = (name, status, detail = '') => report.checks.push({ name, status, detail });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: report.viewport,
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148',
          });
          const page = await context.newPage();

          page.on('console', msg => report.console.push({ type: msg.type(), text: msg.text() }));
          page.on('pageerror', err => report.pageErrors.push(String(err?.stack || err)));
          page.on('requestfailed', req => report.failedRequests.push({ url: req.url(), method: req.method(), failure: req.failure()?.errorText || '' }));
          page.on('response', res => {
            if (res.status() >= 400) report.badResponses.push({ url: res.url(), status: res.status(), method: res.request().method() });
          });

          async function reset() {
            await page.goto(target, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1200);
          }

          async function safeCheck(name, fn) {
            try { await fn(); add(name, 'PASS'); }
            catch (error) { add(name, 'FAIL', String(error?.message || error)); }
          }

          await reset();
          add('首頁載入', page.url().startsWith(target) ? 'PASS' : 'FAIL', page.url());
          await page.screenshot({ path: 'audit-output/mobile-home-initial.png', fullPage: true });

          await safeCheck('無水平溢位', async () => {
            const sizes = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, innerWidth: window.innerWidth }));
            if (sizes.scrollWidth > sizes.innerWidth + 2) throw new Error(JSON.stringify(sizes));
          });

          await safeCheck('手機選單開啟與關閉', async () => {
            const menu = page.getByRole('button', { name: /開啟選單|關閉選單/ }).first();
            await menu.click();
            await page.waitForTimeout(300);
            const expanded = await menu.getAttribute('aria-expanded');
            if (expanded !== 'true') throw new Error(`aria-expanded=${expanded}`);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(200);
            if ((await menu.getAttribute('aria-expanded')) === 'true') await menu.click();
          });

          for (const label of ['二手書籍', '二手物品', '零元贈送']) {
            await safeCheck(`市場切換：${label}`, async () => {
              await reset();
              const menu = page.getByRole('button', { name: /開啟選單/ }).first();
              if (await menu.count()) await menu.click();
              const button = page.getByRole('button', { name: label, exact: true }).last();
              await button.click();
              await page.waitForTimeout(500);
              const body = await page.locator('body').innerText();
              if (!body.includes(label)) throw new Error('切換後頁面未出現市場標籤');
            });
          }

          for (const label of ['我要刊登', '我的交易', '登入／註冊', '訊息', '購物車']) {
            await safeCheck(`未登入入口：${label}`, async () => {
              await reset();
              let button = page.getByRole('button', { name: new RegExp(label) }).first();
              if (!(await button.count())) {
                const menu = page.getByRole('button', { name: /開啟選單/ }).first();
                if (await menu.count()) await menu.click();
                button = page.getByRole('button', { name: new RegExp(label) }).first();
              }
              await button.click();
              await page.waitForTimeout(500);
              const text = await page.locator('body').innerText();
              if (!/登入|註冊|信箱|Google/.test(text)) throw new Error('點擊後未出現登入相關介面');
            });
          }

          await safeCheck('Hero 關鍵字搜尋', async () => {
            await reset();
            const input = page.getByPlaceholder(/搜尋二手書名、課程或老師/);
            await input.fill('微積分');
            await page.getByRole('button', { name: /依目前輸入開始找二手書籍|開始找二手書/ }).first().click();
            await page.waitForTimeout(700);
            const values = await page.locator('input').evaluateAll(inputs => inputs.map(i => i.value));
            if (!values.some(v => v.includes('微積分'))) throw new Error(JSON.stringify(values));
          });

          await safeCheck('列表搜尋', async () => {
            await reset();
            const input = page.getByPlaceholder('搜尋課本...');
            await input.fill('英文');
            await page.waitForTimeout(500);
            if ((await input.inputValue()) !== '英文') throw new Error('搜尋值未保留');
          });

          await safeCheck('科系篩選', async () => {
            await reset();
            const select = page.getByLabel('科系');
            await select.selectOption({ label: '資訊工程系' });
            if ((await select.inputValue()) !== '資訊工程系') throw new Error(await select.inputValue());
          });

          await safeCheck('價格篩選', async () => {
            await reset();
            const select = page.getByLabel('最高價格');
            await select.selectOption('300');
            if ((await select.inputValue()) !== '300') throw new Error(await select.inputValue());
          });

          await safeCheck('圖片搜尋開啟檔案選擇器', async () => {
            await reset();
            const trigger = page.getByRole('button', { name: /用照片找二手書|照片搜二手書/ }).first();
            const chooserPromise = page.waitForEvent('filechooser', { timeout: 5000 });
            await trigger.click();
            await chooserPromise;
          });

          for (const [name, path] of [['隱私權', '/privacy'], ['使用條款', '/terms'], ['交易安全', '/safety']]) {
            await safeCheck(`Footer 導覽：${name}`, async () => {
              await reset();
              await page.getByRole('link', { name, exact: true }).click();
              await page.waitForLoadState('domcontentloaded');
              if (!new URL(page.url()).pathname.startsWith(path)) throw new Error(page.url());
              await page.goBack({ waitUntil: 'domcontentloaded' });
            });
          }

          await safeCheck('問題回報入口', async () => {
            await reset();
            await page.getByRole('button', { name: '問題回報', exact: true }).click();
            await page.waitForTimeout(400);
            const text = await page.locator('body').innerText();
            if (!/問題回報|回報|意見/.test(text)) throw new Error('未顯示回報介面');
          });

          await page.screenshot({ path: 'audit-output/mobile-home-final.png', fullPage: true });
          report.finishedAt = new Date().toISOString();
          report.summary = {
            pass: report.checks.filter(x => x.status === 'PASS').length,
            fail: report.checks.filter(x => x.status === 'FAIL').length,
            consoleErrors: report.console.filter(x => x.type === 'error').length,
            pageErrors: report.pageErrors.length,
            failedRequests: report.failedRequests.length,
            badResponses: report.badResponses.length,
          };
          fs.writeFileSync('audit-output/report.json', JSON.stringify(report, null, 2));
          fs.writeFileSync('audit-output/report.md', [
            '# Mobile homepage readonly audit',
            '',
            `Target: ${target}`,
            `Viewport: ${report.viewport.width}x${report.viewport.height}`,
            '',
            ...report.checks.map(x => `- ${x.status}: ${x.name}${x.detail ? ` — ${x.detail}` : ''}`),
            '',
            `Console errors: ${report.summary.consoleErrors}`,
            `Page errors: ${report.summary.pageErrors}`,
            `Failed requests: ${report.summary.failedRequests}`,
            `HTTP >=400: ${report.summary.badResponses}`,
          ].join('\n'));
          console.log(JSON.stringify(report.summary));
          await browser.close();
          if (report.summary.fail || report.summary.consoleErrors || report.summary.pageErrors) process.exitCode = 1;
          EOF
          node /tmp/mobile-audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-home-readonly-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
