name: Staging marketplace load baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  load-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Run concise safe staging read-only baseline
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          LOAD_TEST_CONFIRM: "yes"
          LOAD_TEST_CONCURRENCY: "20"
          LOAD_TEST_DURATION_SECONDS: "60"
          LOAD_TEST_RAMP_STEPS: "4"
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          export LOAD_TEST_ALLOWED_HOSTS="$(node -e 'console.log(new URL(process.env.NEXT_PUBLIC_SUPABASE_URL).hostname)')"
          curl -fsSL "https://raw.githubusercontent.com/ericpeng0604-coder/bookflow/0a65850fb04cb9afae751e8e6f8a616096eb3e6f/scripts/load-test-marketplace.mjs" -o load-test-marketplace.mjs
          node load-test-marketplace.mjs
