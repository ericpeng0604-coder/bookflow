name: 功能需求
description: 提出新的使用者功能、流程改善或 UI／UX 需求
title: "[FEATURE] "
body:
  - type: markdown
    attributes:
      value: |
        請先說明使用者問題，再描述方案。不要貼出 secrets、真實帳號密碼或完整個資。

  - type: textarea
    id: problem
    attributes:
      label: 要解決的使用者問題
      description: 誰在什麼情境下遇到什麼問題？
      placeholder: 例如：買家在手機版無法快速確認目前購買申請的狀態。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 希望達成的結果
      description: 描述完成後的使用者體驗，不必先限定實作方式。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要影響範圍
      options:
        - 首頁／搜尋／篩選
        - 登入／註冊／學生驗證
        - 商品刊登／圖片／OCR
        - 購物車／購買申請／訂單
        - 聊天／通知
        - 贈送流程
        - 管理員／停權／審核
        - 響應式 UI／Accessibility
        - Supabase／RLS／RPC／Migration
        - CI／部署／監控
        - 其他
    validations:
      required: true

  - type: textarea
    id: proposed_scope
    attributes:
      label: 建議範圍
      description: 列出希望包含的功能或畫面。
      placeholder: |
        - 新增……
        - 調整……
        - 保留……
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 不應修改的範圍
      description: 例如不改交易邏輯、不碰 production、不新增 migration。
      placeholder: 不修改既有 RLS、通知與交易狀態轉移。

  - type: textarea
    id: acceptance
    attributes:
      label: 驗收標準
      description: 請寫成可以明確判定 PASS／FAIL 的條件。
      placeholder: |
        - 390x844 可正常操作
        - TypeScript、ESLint、Playwright 通過
        - 未執行項目標示 NOT VERIFIED
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 參考資料
      description: 可附已遮罩的截圖、設計稿或其他網站案例。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交確認
      options:
        - label: 我已清楚區分需求、限制與驗收標準。
          required: true
        - label: 我沒有在 Issue 中貼出密碼、token、API key 或其他 secrets。
          required: true
